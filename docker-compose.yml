services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "3300:8000"
    environment:
      - ENVIRONMENT=development
      - DECISIONDOC_FREE_MODE=${DECISIONDOC_FREE_MODE:-1}
      - DECISIONDOC_STORAGE=${DECISIONDOC_STORAGE:-local}
      - DECISIONDOC_STATE_STORAGE=${DECISIONDOC_STATE_STORAGE:-local}
      - DECISIONDOC_PROVIDER=${DECISIONDOC_PROVIDER:-mock}
      - DECISIONDOC_PROVIDER_GENERATION=${DECISIONDOC_PROVIDER_GENERATION:-}
      - DECISIONDOC_PROVIDER_ATTACHMENT=${DECISIONDOC_PROVIDER_ATTACHMENT:-}
      - DECISIONDOC_PROVIDER_VISUAL=${DECISIONDOC_PROVIDER_VISUAL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://ollama:11434/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-llama3.1:8b}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-local}
      - LOCAL_LLM_TIMEOUT=${LOCAL_LLM_TIMEOUT:-300}
      - FINETUNE_AUTO_ENABLED=0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production-32c}
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:3300
      - G2B_API_KEY=${G2B_API_KEY}
      - DECISIONDOC_TEMPLATE_VERSION=${DECISIONDOC_TEMPLATE_VERSION:-v1}
    volumes:
      - ./app:/app/app          # hot reload in dev
      - decisiondoc_data:/app/data
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Local Ollama for on-premises LLM (optional)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles:
      - local-llm

volumes:
  decisiondoc_data:
  ollama_models:
